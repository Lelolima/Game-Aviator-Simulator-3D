name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      # Sem Unity no CI: compila os scripts contra stubs da API do Unity.
      - name: Verificação de compilação (stubs Unity)
        run: dotnet build ci/compile-check -warnaserror:CS0103,CS0246,CS0122,CS1061
      - name: Testes da lógica pura
        run: dotnet test Tests/Logica
      - name: Pacotes vulneráveis
        run: dotnet list Tests/Logica package --vulnerable --include-transitive
